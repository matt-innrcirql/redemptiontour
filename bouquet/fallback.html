<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
:root{
  --paper:#efe3cc; --paper-dk:#e2d2b2; --ink:#1b1611; --ink-soft:#4a3f31;
  --red:#cf3a22; --red-dk:#a82a16; --gold:#c2901f; --gold-2:#e7c878; --teal:#1f6f68;
  --f-type:'Special Elite','Courier New',monospace;
  --f-script:'Caveat',cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0706}
body{
  background:radial-gradient(120% 90% at 50% 34%, #221609 0%, #0e0a07 55%, #060403 100%);
  color:var(--paper); font-family:var(--f-type); min-height:100vh;
}
.grain{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:5px 5px}
.vignette{position:fixed;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 240px 70px rgba(0,0,0,.82)}

#stageA{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;transition:opacity 1s ease;padding:20px}
#stageA.gone{opacity:0;pointer-events:none}
.spot{position:absolute;left:50%;top:44%;width:150vw;height:150vw;max-width:820px;max-height:820px;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle, rgba(231,200,120,.16) 0%, rgba(231,200,120,.05) 34%, transparent 62%)}
.deliver{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);
  opacity:0;animation:fadeup 1.4s ease .4s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.envperspective{perspective:1100px;opacity:0;animation:fadeup 1.6s ease .9s forwards}
.envelope{position:relative;width:min(80vw,340px);aspect-ratio:1.58;transform-style:preserve-3d;
  transition:transform 1s ease,opacity .9s ease;filter:drop-shadow(0 30px 32px rgba(0,0,0,.55))}
#stageA.reading .envelope{opacity:0;transform:translateY(46vh) scale(.9)}
.env-back{position:absolute;inset:0;border-radius:7px;background:linear-gradient(160deg,var(--paper) 0%,var(--paper-dk) 100%);
  box-shadow:inset 0 0 26px rgba(90,66,30,.28)}
.env-back::before{content:"";position:absolute;inset:0;border-radius:7px;padding:7px;
  background:repeating-linear-gradient(45deg,var(--red) 0 11px,var(--paper) 11px 22px,var(--teal) 22px 33px,var(--paper) 33px 44px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.85}
.env-letterpeek{position:absolute;left:5%;right:5%;top:6%;bottom:12%;background:#fbf3e0;border-radius:4px;
  box-shadow:0 -2px 10px rgba(0,0,0,.14);transition:transform 1s cubic-bezier(.22,.75,.3,1)}
#stageA.out .env-letterpeek{transform:translateY(-72%)}
.env-front{position:absolute;inset:0;border-radius:0 0 7px 7px;
  background:linear-gradient(200deg,#ece0c4 0%,var(--paper-dk) 70%);
  clip-path:polygon(0 10%, 50% 58%, 100% 10%, 100% 100%, 0 100%);
  box-shadow:inset 0 -8px 22px rgba(90,66,30,.22)}
.env-name{position:absolute;left:0;right:0;top:63%;text-align:center;font-family:var(--f-script);font-weight:700;
  color:var(--red-dk);font-size:clamp(28px,8vw,40px);line-height:1;pointer-events:none;z-index:3}
.env-sub{position:absolute;left:0;right:0;top:86%;text-align:center;font-size:9px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--ink-soft);pointer-events:none;z-index:3}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;transform-origin:top center;transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.55,.06,.35,1);z-index:4}
#stageA.opening .env-flap{transform:rotateX(-169deg)}
.flap-face{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 96%);backface-visibility:hidden}
.flap-front{background:linear-gradient(180deg,#f4ead4 0%,var(--paper-dk) 90%);
  box-shadow:inset 0 -4px 14px rgba(90,66,30,.2)}
.flap-backside{background:#d9c7a1;transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:88%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%, #e0563c 0%, var(--red) 42%, var(--red-dk) 78%, #7c1f10 100%);
  box-shadow:0 3px 9px rgba(0,0,0,.4), inset 0 2px 4px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
.seal span{font-family:var(--f-script);font-weight:700;font-size:30px;color:#f6d9c8;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#stageA.opening .seal{opacity:0}
.tapopen{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-2);
  opacity:0;animation:fadeup 1.4s ease 1.7s forwards, pulse 2.1s ease-in-out 3s infinite;cursor:pointer}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
#stageA.opening .tapopen{animation:none;opacity:0;transition:opacity .4s ease}

.note{position:fixed;left:50%;top:50%;z-index:12;width:min(88vw,380px);
  transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;
  transition:opacity .9s ease .25s, transform .9s cubic-bezier(.2,.7,.3,1) .25s}
#stageA.reading .note{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.note__card{background:linear-gradient(168deg,#fbf3e0 0%,var(--paper) 100%);color:var(--ink);
  border:3px solid var(--ink);box-shadow:0 30px 70px -18px rgba(0,0,0,.75), 0 4px 0 var(--gold);
  padding:26px 24px 24px;text-align:center}
.note__head{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--red);
  border-bottom:1px dashed rgba(60,45,20,.4);padding-bottom:12px}
.nline{opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease}
#stageA.reading .nline{opacity:1;transform:translateY(0)}
.note__hi{font-family:var(--f-script);font-weight:700;font-size:36px;margin:16px 0 6px;transition-delay:.9s!important}
.note__body{font-size:14.5px;line-height:1.75;color:var(--ink-soft);margin:8px 4px}
.note__body b{color:var(--ink)}
.nline.l1{transition-delay:1.5s!important}
.nline.l2{transition-delay:2.3s!important}
.note__sig{font-family:var(--f-script);font-weight:700;font-size:30px;color:var(--red-dk);margin:14px 0 4px;
  transition-delay:3.1s!important}
.nbtn{margin-top:16px;transition-delay:4s!important}
.nbtn button{font-family:var(--f-type);font-size:12px;letter-spacing:.26em;text-transform:uppercase;
  color:#fff;background:linear-gradient(180deg,var(--red) 0%,var(--red-dk) 100%);border:2px solid var(--ink);
  padding:13px 22px;cursor:pointer;box-shadow:0 3px 0 var(--ink), 0 10px 22px rgba(0,0,0,.35)}
.nbtn button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* ============ the flat bouquet ============ */
#stageB{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;opacity:0;pointer-events:none;transition:opacity 1.6s ease;padding:16px}
#stageB.show{opacity:1;pointer-events:auto}
.bqglow{position:absolute;left:50%;top:46%;width:160vw;height:160vw;max-width:900px;max-height:900px;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle, rgba(255,214,130,.22) 0%, rgba(255,214,130,.06) 36%, transparent 64%)}
.bq{width:min(80vw,330px);transform-origin:50% 96%;animation:sway 5.5s ease-in-out infinite alternate;
  filter:drop-shadow(0 26px 30px rgba(0,0,0,.6))}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion: reduce){ .bq{animation:none} }
.cap{text-align:center;pointer-events:none;padding:0 24px;z-index:7}
.cap__t{font-family:var(--f-script);font-weight:700;color:var(--gold-2);
  font-size:clamp(30px,9vw,52px);line-height:1.05;text-shadow:0 2px 26px rgba(0,0,0,.85)}
.cap__s{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);
  margin-top:8px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.endbar{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:8;display:flex;
  justify-content:center;gap:12px}
.ebtn{font-family:var(--f-type);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(231,200,120,.85);background:rgba(10,8,6,.5);border:1px solid rgba(231,200,120,.35);
  padding:9px 14px;border-radius:20px;cursor:pointer;text-decoration:none}
.ebtn:hover{color:var(--gold-2)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="vignette"></div>

<div id="stageB">
  <div class="bqglow"></div>
  <svg class="bq" viewBox="0 0 320 430" role="img" aria-label="A bouquet of yellow roses">
    <defs>
      <g id="rose">
        <g fill="#f6bf3f" stroke="#a06a08" stroke-width="1" stroke-opacity=".45">
          <ellipse rx="16" ry="30" transform="rotate(0)" />
          <ellipse rx="16" ry="30" transform="rotate(45)" />
          <ellipse rx="16" ry="30" transform="rotate(90)" />
          <ellipse rx="16" ry="30" transform="rotate(135)" />
        </g>
        <g fill="#e8a51d" stroke="#8a5108" stroke-width="1" stroke-opacity=".4">
          <ellipse rx="11" ry="20" transform="rotate(22)" />
          <ellipse rx="11" ry="20" transform="rotate(67)" />
          <ellipse rx="11" ry="20" transform="rotate(112)" />
          <ellipse rx="11" ry="20" transform="rotate(157)" />
        </g>
        <circle r="11" fill="#cf8a12" />
        <path d="M -8 0 A 8 8 0 1 1 8 0 A 8 8 0 1 1 -4 5 A 4.5 4.5 0 1 1 4 2 A 2.5 2.5 0 1 0 0 -2"

      </g>
      <g id="leaf">
        <path d="M 0 0 Q 12 -10 26 -4 Q 14 8 0 0 Z" fill="#3a7d3f" stroke="#245427" stroke-width="1" />
      </g>
    </defs>

    <!-- stems -->
    <g stroke="#2e6b34" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M160 305 C 158 250 160 200 160 150" />
      <path d="M150 305 C 130 250 112 215 104 176" />
      <path d="M170 305 C 190 250 208 215 216 176" />
      <path d="M155 300 C 142 240 130 170 127 122" />
      <path d="M165 300 C 178 240 190 170 193 122" />
      <path d="M158 308 C 150 265 138 235 136 212" />
      <path d="M162 308 C 170 265 182 235 184 212" />
    </g>
    <use href="#leaf" x="140" y="255" transform="rotate(-30 140 255)" />
    <use href="#leaf" x="180" y="250" transform="rotate(195 180 250)" />
    <use href="#leaf" x="120" y="215" transform="rotate(-12 120 215)" />

    <!-- baby's breath -->
    <g fill="#fdf8ea" opacity=".9">
      <circle cx="98" cy="132" r="2.6"/><circle cx="112" cy="96" r="2.2"/><circle cx="150" cy="88" r="2.4"/>
      <circle cx="205" cy="90" r="2.4"/><circle cx="232" cy="132" r="2.4"/><circle cx="238" cy="170" r="2.2"/>
      <circle cx="84" cy="170" r="2.3"/><circle cx="160" cy="108" r="2"/><circle cx="182" cy="235" r="2.2"/>
      <circle cx="128" cy="238" r="2.2"/><circle cx="222" cy="112" r="2"/><circle cx="96" cy="110" r="1.9"/>
    </g>

    <!-- roses: crown + circle -->
    <use href="#rose" transform="translate(136,208) scale(.62)" />
    <use href="#rose" transform="translate(184,208) scale(.62) rotate(30)" />
    <use href="#rose" transform="translate(104,176) scale(.8) rotate(14)" />
    <use href="#rose" transform="translate(216,176) scale(.8) rotate(-20)" />
    <use href="#rose" transform="translate(127,120) scale(.88) rotate(40)" />
    <use href="#rose" transform="translate(193,120) scale(.88) rotate(-33)" />
    <use href="#rose" transform="translate(160,152) scale(1.06) rotate(8)" />

    <!-- kraft cone + burgundy liner + gold ribbon -->
    <path d="M105 288 L160 425 L215 288 Q160 312 105 288 Z" fill="#e9dcc0" stroke="#b39b6b" stroke-width="2" />
    <path d="M113 291 Q160 312 207 291 L 160 296 Z" fill="#8f2e1c" />
    <path d="M105 288 L160 425" stroke="#cbb98f" stroke-width="2" fill="none" />
    <rect x="128" y="322" width="64" height="15" rx="7" fill="#c2901f" stroke="#8a5f0e" stroke-width="1.5" />
    <path d="M150 337 L 142 368 L 152 362 Z" fill="#c2901f" stroke="#8a5f0e" stroke-width="1" />
    <path d="M170 337 L 180 366 L 168 361 Z" fill="#c2901f" stroke="#8a5f0e" stroke-width="1" />
    <circle cx="160" cy="329" r="7" fill="#e7c878" stroke="#8a5f0e" stroke-width="1.5" />
  </svg>
  <div class="cap">
    <div class="cap__t">Yellow roses, just for you</div>
    <div class="cap__s">Hand grown &middot; Never wilting</div>
  </div>
</div>

<div id="stageA">
  <div class="spot"></div>
  <div class="deliver">Special Delivery</div>
  <div class="envperspective">
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-letterpeek"></div>
      <div class="env-front"></div>
      <div class="env-name">Josie</div>
      <div class="env-sub">by airmail · handle with care</div>
      <div class="env-flap">
        <div class="flap-face flap-front"><div class="seal"><span>J</span></div></div>
        <div class="flap-face flap-backside"></div>
      </div>
    </div>
  </div>
  <div class="tapopen" id="tapopen">Tap to open</div>

  <div class="note" id="note">
    <div class="note__card">
      <div class="note__head">Special Delivery</div>
      <div class="nline note__hi">Hi Josie,</div>
      <div class="nline l1 note__body">I wish I was in person to give you<br /><b>some more flowers.</b></div>
      <div class="nline l2 note__body"><b>But I made these for you.</b></div>
      <div class="nline note__sig">xo, Matt</div>
      <div class="nline nbtn"><button id="openBouquet">&#10047; Open your bouquet</button></div>
    </div>
  </div>
</div>

<div class="endbar" id="endbar" style="display:none">
  <a class="ebtn" href="/">Back to the passport</a>
</div>

<script>
function capture(n,p){ try{ if(window.posthog) posthog.capture(n,p||{}); }catch(e){} }
(function(){
  var stage=document.getElementById('stageA');
  var opened=false;
  function openEnvelope(){
    if(opened) return; opened=true;
    capture('bouquet_envelope_opened',{fallback:true});
    stage.classList.add('opening');
    setTimeout(function(){ stage.classList.add('out'); }, 750);
    setTimeout(function(){ stage.classList.add('reading'); }, 1650);
  }
  document.getElementById('envelope').addEventListener('click', openEnvelope);
  document.getElementById('tapopen').addEventListener('click', openEnvelope);
  document.getElementById('openBouquet').addEventListener('click', function(){
    capture('bouquet_bloom_started',{fallback:true});
    stage.classList.add('gone');
    document.getElementById('stageB').classList.add('show');
    setTimeout(function(){
      document.getElementById('endbar').style.display='flex';
      capture('bouquet_bloom_finished',{fallback:true});
    }, 2600);
  });
  if(location.search.indexOf('note')>-1){ opened=true; stage.classList.add('opening','out','reading'); }
  if(location.search.indexOf('bloom')>-1){
    opened=true; stage.classList.add('gone');
    document.getElementById('stageB').classList.add('show');
    document.getElementById('endbar').style.display='flex';
  }
})();
</script>
</body>
</html>
