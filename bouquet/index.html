<style>
:root{
  --paper:#efe3cc; --paper-dk:#e2d2b2; --ink:#1b1611; --ink-soft:#4a3f31;
  --red:#cf3a22; --red-dk:#a82a16; --gold:#c2901f; --gold-2:#e7c878; --teal:#1f6f68;
  --f-display:'Anton','Arial Narrow',sans-serif;
  --f-type:'Special Elite','Courier New',monospace;
  --f-script:'Caveat',cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0706}
body{
  background:radial-gradient(120% 90% at 50% 34%, #221609 0%, #0e0a07 55%, #060403 100%);
  color:var(--paper); font-family:var(--f-type); min-height:100vh;
}
#scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;z-index:1;touch-action:manipulation}

/* film grain + vignette (house style) */
.grain{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:5px 5px}
.vignette{position:fixed;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 240px 70px rgba(0,0,0,.82)}

/* ============ ACT I · the envelope (DOM) ============ */
#stageA{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;transition:opacity 1s ease;padding:20px}
#stageA.gone{opacity:0;pointer-events:none}
.spot{position:absolute;left:50%;top:44%;width:150vw;height:150vw;max-width:820px;max-height:820px;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle, rgba(231,200,120,.16) 0%, rgba(231,200,120,.05) 34%, transparent 62%)}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold-2);opacity:0;
  animation:mote 9s linear infinite;pointer-events:none}
@keyframes mote{
  0%{opacity:0;transform:translateY(24px) translateX(0)}
  12%{opacity:.5} 60%{opacity:.35}
  100%{opacity:0;transform:translateY(-140px) translateX(18px)}
}
.deliver{font-family:var(--f-type);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);
  opacity:0;animation:fadeup 1.4s ease .5s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.envperspective{perspective:1100px;opacity:0;animation:fadeup 1.6s ease 1.1s forwards}
.envelope{position:relative;width:min(80vw,340px);aspect-ratio:1.58;transform-style:preserve-3d;
  animation:floaty 4.2s ease-in-out infinite alternate;transition:transform 1s ease,opacity .9s ease;
  filter:drop-shadow(0 30px 32px rgba(0,0,0,.55))}
@keyframes floaty{from{transform:translateY(-7px) rotateX(6deg)}to{transform:translateY(7px) rotateX(2deg)}}
#stageA.opening .envelope{animation:none;transform:translateY(4px) rotateX(10deg)}
#stageA.reading .envelope{opacity:0;transform:translateY(46vh) rotateX(24deg) scale(.9)}

.env-back{position:absolute;inset:0;border-radius:7px;background:linear-gradient(160deg,var(--paper) 0%,var(--paper-dk) 100%);
  box-shadow:inset 0 0 26px rgba(90,66,30,.28)}
/* airmail edge stripes */
.env-back::before{content:"";position:absolute;inset:0;border-radius:7px;padding:7px;
  background:repeating-linear-gradient(45deg,var(--red) 0 11px,var(--paper) 11px 22px,var(--teal) 22px 33px,var(--paper) 33px 44px);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.85}
.env-letterpeek{position:absolute;left:5%;right:5%;top:6%;bottom:12%;background:#fbf3e0;border-radius:4px;
  box-shadow:0 -2px 10px rgba(0,0,0,.14);transition:transform 1s cubic-bezier(.22,.75,.3,1)}
#stageA.out .env-letterpeek{transform:translateY(-72%)}
.env-front{position:absolute;inset:0;border-radius:0 0 7px 7px;
  background:linear-gradient(200deg,#ece0c4 0%,var(--paper-dk) 70%);
  clip-path:polygon(0 10%, 50% 58%, 100% 10%, 100% 100%, 0 100%);
  box-shadow:inset 0 -8px 22px rgba(90,66,30,.22)}
.env-front::after{content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 49.6%,rgba(90,66,30,.18) 50%,transparent 50.6%),
             linear-gradient(-115deg,transparent 49.6%,rgba(90,66,30,.18) 50%,transparent 50.6%)}
.env-name{position:absolute;left:0;right:0;top:63%;text-align:center;font-family:var(--f-script);font-weight:700;
  color:var(--red-dk);font-size:clamp(28px,8vw,40px);line-height:1;pointer-events:none;z-index:3}
.env-sub{position:absolute;left:0;right:0;top:86%;text-align:center;font-family:var(--f-type);
  font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);pointer-events:none;z-index:3}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;transform-origin:top center;transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.55,.06,.35,1);z-index:4}
#stageA.opening .env-flap{transform:rotateX(-169deg)}
.flap-face{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 96%);backface-visibility:hidden}
.flap-front{background:linear-gradient(180deg,#f4ead4 0%,var(--paper-dk) 90%);
  box-shadow:inset 0 -4px 14px rgba(90,66,30,.2)}
.flap-backside{background:#d9c7a1;transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:88%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%, #e0563c 0%, var(--red) 42%, var(--red-dk) 78%, #7c1f10 100%);
  box-shadow:0 3px 9px rgba(0,0,0,.4), inset 0 2px 4px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
.seal span{font-family:var(--f-script);font-weight:700;font-size:30px;color:#f6d9c8;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#stageA.opening .seal{opacity:0}
.tapopen{font-family:var(--f-type);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-2);
  opacity:0;animation:fadeup 1.4s ease 1.9s forwards, pulse 2.1s ease-in-out 3.3s infinite;cursor:pointer}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
#stageA.opening .tapopen{animation:none;opacity:0;transition:opacity .4s ease}

/* the readable note */
.note{position:fixed;left:50%;top:50%;z-index:12;width:min(88vw,380px);
  transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;
  transition:opacity .9s ease .25s, transform .9s cubic-bezier(.2,.7,.3,1) .25s}
#stageA.reading .note{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.note__card{background:linear-gradient(168deg,#fbf3e0 0%,var(--paper) 100%);color:var(--ink);
  border:3px solid var(--ink);box-shadow:0 30px 70px -18px rgba(0,0,0,.75), 0 4px 0 var(--gold);
  padding:26px 24px 24px;text-align:center}
.note__head{font-family:var(--f-type);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--red);
  border-bottom:1px dashed rgba(60,45,20,.4);padding-bottom:12px}
.nline{opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease}
#stageA.reading .nline{opacity:1;transform:translateY(0)}
.note__hi{font-family:var(--f-script);font-weight:700;font-size:36px;margin:16px 0 6px;transition-delay:.9s!important}
.note__body{font-family:var(--f-type);font-size:14.5px;line-height:1.75;color:var(--ink-soft);margin:8px 4px}
.note__body b{color:var(--ink)}
.nline.l1{transition-delay:1.5s!important}
.nline.l2{transition-delay:2.3s!important}
.note__sig{font-family:var(--f-script);font-weight:700;font-size:30px;color:var(--red-dk);margin:14px 0 4px;
  transition-delay:3.1s!important}
.nbtn{margin-top:16px;transition-delay:4s!important}
.nbtn button{font-family:var(--f-type);font-size:12px;letter-spacing:.26em;text-transform:uppercase;
  color:#fff;background:linear-gradient(180deg,var(--red) 0%,var(--red-dk) 100%);border:2px solid var(--ink);
  padding:13px 22px;cursor:pointer;box-shadow:0 3px 0 var(--ink), 0 10px 22px rgba(0,0,0,.35)}
.nbtn button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* ============ ACT II · captions over the 3D bouquet ============ */
.cap{position:fixed;left:0;right:0;bottom:15%;z-index:7;text-align:center;pointer-events:none;
  padding:0 24px;opacity:0;transition:opacity 1.4s ease}
.cap.show{opacity:1}
.cap__t{font-family:var(--f-script);font-weight:700;color:var(--gold-2);
  font-size:clamp(30px,9vw,56px);line-height:1.05;text-shadow:0 2px 26px rgba(0,0,0,.85)}
.cap__s{font-family:var(--f-type);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);
  margin-top:10px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.endbar{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:8;display:flex;
  justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity 1s ease}
.endbar.show{opacity:1;pointer-events:auto}
.ebtn{font-family:var(--f-type);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(231,200,120,.85);background:rgba(10,8,6,.5);border:1px solid rgba(231,200,120,.35);
  padding:9px 14px;border-radius:20px;cursor:pointer;text-decoration:none}
.ebtn:hover{color:var(--gold-2)}
</style>
</head>

<canvas id="scene"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<div id="stageA">
  <div class="spot"></div>
  <div class="deliver">Special Delivery</div>
  <div class="envperspective">
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-letterpeek"></div>
      <div class="env-front"></div>
      <div class="env-name">Josie</div>
      <div class="env-sub">by airmail · handle with care</div>
      <div class="env-flap">
        <div class="flap-face flap-front"><div class="seal"><span>J</span></div></div>
        <div class="flap-face flap-backside"></div>
      </div>
    </div>
  </div>
  <div class="tapopen" id="tapopen">Tap to open</div>

  <div class="note" id="note">
    <div class="note__card">
      <div class="note__head">Special Delivery</div>
      <div class="nline note__hi">Hi Josie,</div>
      <div class="nline l1 note__body">I wish I was in person to give you<br /><b>some more flowers.</b></div>
      <div class="nline l2 note__body"><b>But I made these for you.</b></div>
      <div class="nline note__sig">xo, Matt</div>
      <div class="nline nbtn"><button id="openBouquet">&#10047; Open your bouquet</button></div>
    </div>
  </div>
</div>

<div class="cap" id="cap">
  <div class="cap__t">Yellow roses, just for you</div>
  <div class="cap__s">Hand grown &middot; Never wilting</div>
</div>
<div class="endbar" id="endbar">
  <button class="ebtn" id="replay">Replay the bloom</button>
  <a class="ebtn" href="/">Back to the passport</a>
</div>

<script>
/* Analytics helper (guarded, house pattern) */
function capture(n,p){ try{ if(window.posthog) posthog.capture(n,p||{}); }catch(e){} }

/* Graceful fallback: no WebGL or reduced-motion -> the flat bouquet. */
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function hasWebGL(){ try{ var c=document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl')||c.getContext('experimental-webgl'))); }catch(e){ return false; } }
  if(reduce || !hasWebGL()){
    capture('bouquet_fallback', { reason: reduce ? 'reduced-motion' : 'no-webgl' });
    window.location.replace('fallback.html');
  }
})();

/* floating dust motes in the envelope scene */
(function(){
  var stage = document.getElementById('stageA');
  for(var i=0;i<16;i++){
    var m=document.createElement('div'); m.className='mote';
    m.style.left=(6+Math.random()*88)+'%';
    m.style.top=(18+Math.random()*66)+'%';
    m.style.animationDelay=(Math.random()*9)+'s';
    m.style.animationDuration=(7+Math.random()*6)+'s';
    stage.appendChild(m);
  }
})();

/* Act I choreography: tap -> flap opens -> letter rises -> note readable */
(function(){
  var stage=document.getElementById('stageA');
  var opened=false;
  function openEnvelope(){
    if(opened) return; opened=true;
    capture('bouquet_envelope_opened');
    stage.classList.add('opening');
    setTimeout(function(){ stage.classList.add('out'); }, 750);
    setTimeout(function(){ stage.classList.add('reading'); }, 1650);
  }
  document.getElementById('envelope').addEventListener('click', openEnvelope);
  document.getElementById('tapopen').addEventListener('click', openEnvelope);
  document.getElementById('openBouquet').addEventListener('click', function(){
    capture('bouquet_bloom_started');
    stage.classList.add('gone');
    if(window.__startBloom) window.__startBloom();
  });
  /* dev affordances: ?note jumps to the note, ?bloom straight to the flowers */
  if(location.search.indexOf('note')>-1){ opened=true; stage.classList.add('opening','out','reading'); }
  if(location.search.indexOf('bloom')>-1){
    opened=true; stage.classList.add('gone');
    window.__autoBloom = true;
  }
})();
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ---------- helpers ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const smoothstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* ---------- renderer / composer ---------- */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setClearColor(0x0a0705, 1);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, .1, 60);
camera.position.set(0, .5, 12.5);
camera.lookAt(0, -0.2, 0);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass=new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), .55, .5, .34);
composer.addPass(bloomPass);

window.addEventListener('resize', ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  renderFrame();
});

/* ---------- backdrop + light ---------- */
(function(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(256,236,30,256,256,330);
  grad.addColorStop(0,'#2a1a0a'); grad.addColorStop(.55,'#120c06'); grad.addColorStop(1,'#060403');
  g.fillStyle=grad; g.fillRect(0,0,512,512);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const back=new THREE.Mesh(new THREE.PlaneGeometry(42,42), new THREE.MeshBasicMaterial({map:tex}));
  back.position.set(0,0,-11); scene.add(back);
})();
scene.add(new THREE.AmbientLight(0x4a3820, 1.05));
const key=new THREE.DirectionalLight(0xfff1d0, 2.1); key.position.set(2.5,4,3); scene.add(key);
const fill=new THREE.PointLight(0xffd98a, 1.1, 14); fill.position.set(0,.6,3.2); scene.add(fill);
const rim=new THREE.DirectionalLight(0xcf8a3a, .9); rim.position.set(-2.5,3,-4); scene.add(rim);

function softTexture(inner, outer){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(64,64,2,64,64,62);
  grad.addColorStop(0,inner); grad.addColorStop(1,outer);
  g.fillStyle=grad; g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

/* warm glow behind the bouquet */
const glow=new THREE.Sprite(new THREE.SpriteMaterial({
  map:softTexture('rgba(255,214,130,0.95)','rgba(255,214,130,0)'),
  blending:THREE.AdditiveBlending, transparent:true, opacity:0, depthWrite:false}));
glow.scale.set(6.4,6.4,1); glow.position.set(0,-.5,-3.2); scene.add(glow);

/* ---------- petal geometry (shared) ---------- */
function makePetalGeometry(){
  const nx=9, ny=12, pos=[], norm=[], uvs=[], idx=[];
  for(let j=0;j<=ny;j++){
    const v=j/ny;
    let w=Math.pow(Math.sin(Math.PI*(0.10+0.82*v)),0.72);
    w*=1-0.3*smoothstep(0.82,1,v);
    for(let i=0;i<=nx;i++){

      const x=(u-0.5)*w*1.15;
      const y=v;
      let z=-Math.pow((u-0.5)*2,2)*0.3*(0.35+0.65*v); /* cup, concave toward -Z */

      pos.push(x,y,z); uvs.push(u,v);

  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs,2));

  geo.computeVertexNormals();

const petalGeo=makePetalGeometry();

const RING_MATS=[
  new THREE.MeshStandardMaterial({color:0xd99a1a, roughness:.55, side:THREE.DoubleSide, emissive:0x805214, emissiveIntensity:.34}),
  new THREE.MeshStandardMaterial({color:0xf2b52e, roughness:.53, side:THREE.DoubleSide, emissive:0x805214, emissiveIntensity:.3}),
  new THREE.MeshStandardMaterial({color:0xffcf52, roughness:.5, side:THREE.DoubleSide, emissive:0x8a5c14, emissiveIntensity:.28}),
  new THREE.MeshStandardMaterial({color:0xffe392, roughness:.48, side:THREE.DoubleSide, emissive:0x8a5c14, emissiveIntensity:.26}),
];
const SEPAL_MAT=new THREE.MeshStandardMaterial({color:0x2e6b34, roughness:.8, side:THREE.DoubleSide});
const STEM_MAT=new THREE.MeshStandardMaterial({color:0x2e6b34, roughness:.85});
const LEAF_MAT=new THREE.MeshStandardMaterial({color:0x3a7d3f, roughness:.75, side:THREE.DoubleSide});

/* ---------- a procedural rose ---------- */
function makeRose(){
  const rose=new THREE.Group();
  const rings=[
    {n:3, r:0.045, closed:0.02, open:0.2, s:0.55, m:0},
    {n:5, r:0.115, closed:0.05, open:0.48, s:0.8, m:1},
    {n:7, r:0.190, closed:0.09, open:0.78, s:1.0, m:2},
    {n:9, r:0.265, closed:0.14, open:1.02, s:1.08, m:3},
  ];
  const ringData=[];
  rings.forEach((ring,k)=>{
    const pivots=[];
    for(let i=0;i<ring.n;i++){
      const az=i*(Math.PI*2/ring.n)+k*0.55;
      const hinge=new THREE.Group();
      hinge.position.set(Math.sin(az)*ring.r, k*0.015, Math.cos(az)*ring.r);
      hinge.rotation.y=az;
      const petal=new THREE.Mesh(petalGeo, RING_MATS[ring.m]);
      petal.scale.set(ring.s*0.78, ring.s, ring.s);
      petal.rotation.y=(Math.random()-.5)*0.22;
      hinge.add(petal);
      hinge.userData.jit=1+(Math.random()-.5)*0.16;
      rose.add(hinge);
      pivots.push(hinge);
    }
    ringData.push({pivots, closed:ring.closed, open:ring.open});
  });
  /* sepals + calyx under the petals */
  for(let i=0;i<5;i++){
    const az=i*(Math.PI*2/5)+0.3;
    const hinge=new THREE.Group();
    hinge.position.set(Math.sin(az)*0.1, -0.05, Math.cos(az)*0.1);
    hinge.rotation.y=az; hinge.rotation.x=1.8;
    const sep=new THREE.Mesh(petalGeo, SEPAL_MAT);
    sep.scale.set(0.2,0.36,0.28);
    hinge.add(sep); rose.add(hinge);
  }
  const calyx=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8), SEPAL_MAT);
  calyx.position.y=-0.08; calyx.scale.set(1,1.25,1); rose.add(calyx);

  rose.userData.setBloom=function(t){
    ringData.forEach((ring,k)=>{
      const e=easeInOutCubic(clamp(t*1.45-k*0.17, 0, 1));
      ring.pivots.forEach(p=>{ p.rotation.x=(ring.closed+(ring.open-ring.closed)*e)*p.userData.jit; });
    });
    const s=0.8+0.2*easeOutCubic(clamp(t*1.2,0,1));
    rose.scale.setScalar(rose.userData.baseScale*s);
  };
  return rose;
}

/* ---------- the bouquet ---------- */
const bouquet=new THREE.Group();
scene.add(bouquet);

/* wrap: outer kraft cone + burgundy liner + gold ribbon */
const cone=new THREE.Mesh(
  new THREE.CylinderGeometry(1.18, 0.16, 2.3, 40, 1, true),
  new THREE.MeshStandardMaterial({color:0xe9dcc0, roughness:.95, side:THREE.DoubleSide}));
cone.position.y=1.0; bouquet.add(cone);
const liner=new THREE.Mesh(
  new THREE.CylinderGeometry(1.08, 0.15, 2.24, 40, 1, true),
  new THREE.MeshStandardMaterial({color:0x8f2e1c, roughness:.85, side:THREE.DoubleSide}));
liner.position.y=1.03; bouquet.add(liner);
const ribbon=new THREE.Mesh(
  new THREE.TorusGeometry(0.5, 0.075, 12, 40),
  new THREE.MeshStandardMaterial({color:0xc2901f, roughness:.35, metalness:.5, emissive:0x3d2a05, emissiveIntensity:.7}));
ribbon.rotation.x=Math.PI/2; ribbon.scale.set(1,1,.8); ribbon.position.y=0.62; bouquet.add(ribbon);

/* seven roses: one crown, six around */
const roses=[];
function addRose(x,y,z,scale,tiltOut){
  const rose=makeRose();
  rose.userData.baseScale=scale;
  rose.position.set(x,y,z);
  const d=new THREE.Vector3(x,0,z);
  if(d.lengthSq()>0.001){
    d.normalize();
    rose.setRotationFromAxisAngle(new THREE.Vector3(d.z,0,-d.x).normalize(), -tiltOut);
  }
  rose.rotateY(Math.random()*6.3);
  /* tip every head a little toward the camera so we see into the bloom */
  rose.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), 0.34));
  rose.userData.setBloom(0);
  bouquet.add(rose); roses.push(rose);

  /* stem from inside the cone up to the rose */
  const curve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(x*0.2, 1.4, z*0.2),
    new THREE.Vector3(x*0.65, (1.4+y)/2, z*0.65),
    new THREE.Vector3(x, y-0.12, z),
  ]);
  bouquet.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.045, 6), STEM_MAT));
}
addRose(0, 3.38, 0.02, 0.68, 0);
for(let i=0;i<6;i++){
  const az=i*(Math.PI/3)+0.26;
  addRose(Math.sin(az)*0.72, 2.72+((i%3)*0.14), Math.cos(az)*0.72, 0.56+(i%2)*0.06, 0.32);
}

/* leaves at the cone mouth */
for(let i=0;i<5;i++){
  const az=i*(Math.PI*2/5)+0.8;
  const hinge=new THREE.Group();
  hinge.position.set(Math.sin(az)*0.55, 1.95, Math.cos(az)*0.55);
  hinge.rotation.y=az; hinge.rotation.x=1.15;
  const leaf=new THREE.Mesh(petalGeo, LEAF_MAT);
  leaf.scale.set(0.5,0.95,0.55);
  hinge.add(leaf); bouquet.add(hinge);
}

/* baby's breath: little white sparks around the heads */
(function(){
  const pts=[];
  for(let i=0;i<110;i++){
    const host=roses[(Math.random()*roses.length)|0];
    pts.push(
      host.position.x+(Math.random()-.5)*1.15,
      host.position.y+(Math.random()-.4)*0.8,
      host.position.z+(Math.random()-.5)*1.15);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  const m=new THREE.PointsMaterial({size:.055, map:softTexture('rgba(255,252,240,1)','rgba(255,252,240,0)'),
    transparent:true, opacity:.9, depthWrite:false, alphaTest:.02});
  bouquet.add(new THREE.Points(g,m));
})();

/* the bouquet starts below the frame; its origin is the cone base */
const BOUQUET_Y_END=-2.3, BOUQUET_Y_START=-9.5;
bouquet.position.y=BOUQUET_Y_START;

/* ---------- golden dust across the whole scene ---------- */
const dustClouds=[];
for(let c=0;c<2;c++){
  const pts=[];
  for(let i=0;i<130;i++) pts.push((Math.random()-.5)*11,(Math.random()-.5)*8,(Math.random()-.5)*5+0.5);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  const m=new THREE.PointsMaterial({size:.04, map:softTexture('rgba(231,200,120,1)','rgba(231,200,120,0)'),
    transparent:true, opacity:.5, blending:THREE.AdditiveBlending, depthWrite:false});
  const cloud=new THREE.Points(g,m);
  cloud.userData.dir=c?1:-1;
  scene.add(cloud); dustClouds.push(cloud);
}

/* ---------- falling petals for the finale ---------- */
const fallers=[];
const fallMat=new THREE.MeshBasicMaterial({color:0xffd977, side:THREE.DoubleSide, transparent:true, opacity:.85});
function spawnPetalRain(){
  if(fallers.length) return;
  for(let i=0;i<24;i++){
    const p=new THREE.Mesh(petalGeo, fallMat);
    p.scale.setScalar(0.13+Math.random()*0.09);
    p.position.set((Math.random()-.5)*5.6, 3.6+Math.random()*4, (Math.random()-.5)*2.5+0.6);
    p.rotation.set(Math.random()*6.3, Math.random()*6.3, Math.random()*6.3);
    p.userData={vy:.35+Math.random()*.35, ph:Math.random()*6.3,
      rx:(Math.random()-.5)*1.6, rz:(Math.random()-.5)*1.6};
    scene.add(p); fallers.push(p);
  }
}

/* ---------- timeline ---------- */
const CAM_START=new THREE.Vector3(0,.5,12.5), CAM_END=new THREE.Vector3(0,.6,9.0);
const LOOK_START=new THREE.Vector3(0,-.6,0), LOOK_END=new THREE.Vector3(0,.22,0);
let state='waiting';            /* waiting -> blooming -> done */
let bloomT0=0, raf=0, capShown=false, endShown=false;
const clock=new THREE.Clock();
const px={x:0,y:0,tx:0,ty:0};   /* pointer parallax */
window.addEventListener('pointermove', e=>{
  px.tx=(e.clientX/window.innerWidth-.5)*0.5;
  px.ty=(e.clientY/window.innerHeight-.5)*0.28;
});

function renderFrame(){ composer.render(); window.__bouquetFrames=(window.__bouquetFrames||0)+1; }

function animate(){
  raf=requestAnimationFrame(animate);
  const now=clock.getElapsedTime();
  const dt=Math.min(clock.getDelta(), .05)||.016;

  dustClouds.forEach(cl=>{
    cl.rotation.y+=dt*.02*cl.userData.dir;
    cl.position.y=Math.sin(now*.16*cl.userData.dir)*.35;
  });

  if(state==='blooming'||state==='done'){
    const t=now-bloomT0;
    /* rise */
    const rise=easeOutCubic(clamp(t/2.1,0,1));
    bouquet.position.y=BOUQUET_Y_START+(BOUQUET_Y_END-BOUQUET_Y_START)*rise;
    /* glow breathes in */
    glow.material.opacity=.42*smoothstep(1.2,3.4,t)+Math.sin(now*1.4)*.03;
    /* bloom each rose, outer circle first, crown rose last */
    const bt=clamp((t-1.9)/4.6, 0, 1);
    roses.forEach((rose,i)=>{
      const order=(i===0)?6:(i-1);
      rose.userData.setBloom(clamp(bt*2.1-order*0.16, 0, 1));
    });
    /* camera push-in with a gentle orbit sway */
    const cp=easeInOutCubic(clamp((t-1.2)/4.8,0,1));
    camera.position.lerpVectors(CAM_START, CAM_END, cp);
    camera.position.x+=Math.sin(now*.24)*.18*cp + px.x;
    camera.position.y+=Math.sin(now*.31)*.08*cp - px.y;
    const look=new THREE.Vector3().lerpVectors(LOOK_START, LOOK_END, cp);
    camera.lookAt(look);
    /* idle life once bloomed */
    bouquet.rotation.z=Math.sin(now*.5)*.012*cp;
    bouquet.rotation.y=Math.sin(now*.21)*.05*cp;

    if(t>6.4&&!capShown){ capShown=true; document.getElementById('cap').classList.add('show'); spawnPetalRain(); }
    if(t>9&&!endShown){ endShown=true; state='done';
      document.getElementById('endbar').classList.add('show');
      capture('bouquet_bloom_finished'); }
  }

  fallers.forEach(p=>{
    p.position.y-=p.userData.vy*dt;
    p.position.x+=Math.sin(now*.8+p.userData.ph)*.004;
    p.rotation.x+=p.userData.rx*dt; p.rotation.z+=p.userData.rz*dt;
    if(p.position.y<-3.6){ p.position.y=3.6+Math.random()*2; p.position.x=(Math.random()-.5)*5.6; }
  });

  px.x+=(px.tx-px.x)*.04; px.y+=(px.ty-px.y)*.04;
  renderFrame();
}

window.__startBloom=function(){
  if(state!=='waiting') return;
  state='blooming';
  clock.getDelta();
  bloomT0=clock.getElapsedTime();
  if(!raf) animate();
};
document.getElementById('replay').addEventListener('click', ()=>{
  capture('bouquet_replay');
  capShown=false; endShown=false;
  document.getElementById('cap').classList.remove('show');
  document.getElementById('endbar').classList.remove('show');
  roses.forEach(r=>r.userData.setBloom(0));
  bouquet.position.y=BOUQUET_Y_START;
  glow.material.opacity=0;
  state='blooming'; bloomT0=clock.getElapsedTime();
});

/* prewarm: one still frame so the tap into Act II is instant */
roses.forEach(r=>r.userData.setBloom(0));
renderFrame();
window.__bouquetReady=true;
if(!raf) animate();   /* keep the dust alive behind the envelope */
if(window.__autoBloom) window.__startBloom();
</script>

<script>
/* Watchdog: if the 3D never initialized (import maps unsupported, CDN blocked,
   WebGL init failure) fall back to the flat bouquet before she gets far. */
setTimeout(function(){
  if(!window.__bouquetReady && location.pathname.indexOf('fallback')===-1){
    capture('bouquet_fallback', { reason:'no-frames-watchdog' });
    window.location.replace('fallback.html');
  }
}, 6000);
</script>
</body>
</html>
