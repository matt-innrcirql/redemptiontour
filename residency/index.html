<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Residency · Matt & Josie</title>
<meta name="description" content="The Redemption Tour is over. A new one begins." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
:root{
  --wall:#15110c; --wall-2:#1d1810;
  --paper:#efe3cc; --paper-2:#e7d8b9; --paper-3:#ddc9a3;
  --ink:#1b1611; --ink-soft:#4a3f31;
  --red:#cf3a22; --red-dk:#a82a16; --gold:#c2901f; --teal:#1f6f68;
  --f-display:'Anton','Arial Narrow',sans-serif;
  --f-type:'Special Elite','Courier New',monospace;
  --f-script:'Caveat',cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:radial-gradient(120% 90% at 50% -10%, #241d14 0%, var(--wall) 55%, #0e0b07 100%);
  color:var(--ink); font-family:var(--f-type); min-height:100vh; overflow-x:hidden;
}
.grain{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
  background-image:radial-gradient(var(--ink) 1px,transparent 1.2px);background-size:6px 6px}
.vignette{position:fixed;inset:0;z-index:8999;pointer-events:none;box-shadow:inset 0 0 220px 60px rgba(0,0,0,.7)}

/* top marquee ticker */
.ticker{position:fixed;top:0;left:0;right:0;z-index:8000;background:var(--ink);color:var(--paper);
  border-bottom:2px solid var(--gold);overflow:hidden;white-space:nowrap;font-family:var(--f-type);
  font-size:12px;letter-spacing:.28em;text-transform:uppercase;height:30px;display:flex;align-items:center}
.ticker__track{display:inline-flex;animation:marq 32s linear infinite;will-change:transform}
.ticker__track span{padding:0 26px}
.ticker__track span b{color:var(--gold);font-weight:400}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker.is-yes{background:var(--red-dk);border-bottom-color:var(--paper)}
.ticker.is-yes .ticker__track span b{color:#fff}

.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:54px 18px 90px}

/* poster */
.poster{position:relative;width:100%;max-width:680px;margin-top:18px;border:3px solid var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(0,0,0,.05)),var(--paper);
  box-shadow:0 42px 90px -26px rgba(0,0,0,.78),0 0 0 1px rgba(255,220,130,.24),0 4px 0 var(--gold);
  padding:26px 24px 22px;isolation:isolate;overflow:hidden}
.poster__frame{position:relative;border:2px solid var(--ink);padding:24px 20px 20px;background:rgba(239,227,204,.82)}
.tape{position:absolute;width:120px;height:30px;background:rgba(207,180,120,.45);
  border:1px dashed rgba(80,60,20,.4);top:-16px;left:50%;margin-left:-60px;transform:rotate(-4deg)}

.presents{text-align:center;color:var(--ink-soft);font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:6px}
.kicker{text-align:center;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--red);margin:8px 0 6px}

.ptitle{text-align:center;position:relative}
.ptitle__l1{font-family:var(--f-display);font-size:clamp(34px,9vw,64px);color:var(--ink);
  text-transform:uppercase;line-height:.9;display:block;letter-spacing:.01em}
.ptitle__l1 em{font-style:normal;color:var(--red)}
.ptitle__script{position:relative;display:inline-block;font-family:var(--f-script);font-weight:700;
  color:var(--red);font-size:clamp(40px,12vw,92px);line-height:.8;transform:rotate(-3deg);margin:2px 0}

.headliner{text-align:center;margin:18px 0 6px}
.headliner__tab{font-family:var(--f-type);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
.headliner__name{font-family:var(--f-display);text-transform:uppercase;font-size:clamp(30px,8vw,52px);
  line-height:.95;letter-spacing:.02em;color:var(--ink);margin-top:2px}
.headliner__name em{font-style:normal;color:var(--red)}

.venue{text-align:center;font-family:var(--f-display);text-transform:uppercase;font-size:clamp(18px,5vw,28px);
  letter-spacing:.04em;color:var(--ink);margin-top:8px}
.dates{text-align:center;font-family:var(--f-display);font-size:clamp(24px,7vw,44px);letter-spacing:.05em;color:var(--ink)}
.dates .yr{color:var(--red)} .dates .dot{color:var(--gold)}

.finefoot{text-align:center;font-size:10.5px;letter-spacing:.05em;color:var(--ink-soft);margin-top:14px;line-height:1.5}

/* tap hint */
.taphint{text-align:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);
  margin:16px 0 0;opacity:.85;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</head>
<body>
<div class="grain"></div>
<div class="vignette"></div>
<div class="ticker" id="ticker"><div class="ticker__track" id="tickerTrack"></div></div>

<div class="stage" id="stage">
  <div class="poster" id="poster">
    <div class="poster__frame">
      <div class="tape"></div>
      <div class="presents">The City of Chicago (unofficially) presents</div>
      <div class="kicker" id="kicker">A Live Redemption Event</div>

      <div class="ptitle" id="ptitle">
        <span class="ptitle__l1">One <em>Date</em> · One Shot</span>
        <span class="ptitle__script" id="scriptTitle">the redemption tour</span>
      </div>

      <div class="headliner">
        <div class="headliner__tab">Headlining</div>
        <div class="headliner__name" id="headlinerName">Matt Yee</div>
      </div>

      <div class="venue">Live in Chicago, Illinois</div>
      <div class="dates">JUN 3 <span class="dot">·</span> 4 <span class="dot">·</span> 5 <span class="dot">·</span> 6 <span class="yr">'26</span></div>

      <div class="finefoot" id="finefoot">Doors 6:00 PM · No refunds · One redemption per customer</div>
      <div class="taphint" id="taphint">tap to continue</div>
    </div>
  </div>
</div>

<script>
/* ticker seed (beat 1 copy) */
(function(){
  var t = document.getElementById('tickerTrack');
  var msg = '<span>THE REDEMPTION TOUR <b>·</b> ONE DATE, ONE SHOT <b>·</b> LIVE IN CHICAGO <b>·</b> </span>';
  t.innerHTML = msg + msg; // duplicated for seamless marquee
})();
</script>
</body>
</html>
