<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  :root{
    --wall:#15110c; --paper:#efe3cc; --paper-2:#e7d8b9;
    --ink:#1b1611; --ink-soft:#4a3f31; --red:#cf3a22; --gold:#c2901f; --line:#2a2118;
    --f-display:'Anton','Arial Narrow',sans-serif;
    --f-type:'Special Elite','Courier New',monospace;
    --f-script:'Caveat',cursive;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1200px; height:630px; }
  body{
    font-family:var(--f-type); color:var(--ink);
    background:radial-gradient(120% 110% at 50% -10%, #241d14 0%, var(--wall) 55%, #0e0b07 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  /* halftone dots, like the site */
  .dots{
    position:absolute; inset:0; pointer-events:none; opacity:.05;
    background-image:radial-gradient(#efe3cc 1.1px, transparent 1.2px);
    background-size:14px 14px;
  }
  .vignette{ position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 200px 50px rgba(0,0,0,.7); }

  .frame{
    position:relative;
    width:1104px; height:534px;
    background:linear-gradient(180deg, rgba(255,255,255,.25), rgba(0,0,0,.05)), var(--paper);
    border:3px solid var(--ink);
    box-shadow:0 30px 70px -20px rgba(10,7,3,.55), 0 6px 0 var(--gold);
    display:grid; grid-template-columns:1fr 360px;
  }
  .frame::before{
    content:""; position:absolute; inset:14px; border:2px solid var(--ink); pointer-events:none;
  }
  /* torn tape */
  .tape{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:230px; height:38px; background:rgba(194,144,31,.55);
    border-left:2px dashed rgba(27,22,17,.3); border-right:2px dashed rgba(27,22,17,.3);
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }

  .left{ padding:46px 30px 36px 50px; display:flex; flex-direction:column; justify-content:center; }

  .presents{
    text-align:center; color:var(--ink-soft); font-size:15px;
    letter-spacing:.18em; text-transform:uppercase; margin-bottom:4px;
  }
  .kicker{
    text-align:center; color:var(--red); font-size:13px;
    letter-spacing:.16em; text-transform:uppercase; margin-bottom:14px;
  }
  .title{ text-align:center; line-height:.84; }
  .title .l1{ font-family:var(--f-display); font-size:96px; color:var(--ink); display:block; }
  .title .l1 em{ font-style:normal; color:var(--red); }
  .amp{ display:block; font-family:var(--f-script); color:var(--gold);
    font-size:44px; line-height:.7; margin:4px 0; }
  .script{
    position:relative; text-align:center; color:var(--red);
    font-family:var(--f-script); font-weight:700; font-size:84px; line-height:.8;
    transform:rotate(-3deg); margin:4px 0 6px;
  }
  .script::after{ content:""; display:block; width:46%; height:4px;
    background:var(--gold); margin:4px auto 0; border-radius:2px; transform:rotate(.4deg); }

  .venue{ text-align:center; font-family:var(--f-display); font-size:34px;
    color:var(--ink); letter-spacing:.02em; margin-top:14px; }
  .dates{ text-align:center; font-family:var(--f-display); font-size:46px;
    color:var(--ink); letter-spacing:.04em; margin-top:2px; }
  .dates .dot{ color:var(--gold); }
  .dates .yr{ color:var(--red); }
  .stars{ text-align:center; color:var(--gold); letter-spacing:3px;
    font-size:18px; margin-top:12px; }
  .cta{
    margin:14px auto 0; display:inline-block;
    background:var(--red); color:var(--paper);
    font-family:var(--f-display); font-size:30px; letter-spacing:.03em;
    text-transform:uppercase; padding:12px 26px;
    border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
    transform:rotate(-1.5deg); white-space:nowrap;
  }
  .cta em{ font-style:normal; color:var(--gold); }
  .ctawrap{ text-align:center; }

  /* right rail: headliner */
  .right{
    position:relative; background:var(--ink);
    border-left:3px solid var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:30px 26px; gap:0;
  }
  .right::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:0;
    border-left:2px dashed rgba(239,227,204,.35);
  }
  .tab{ color:var(--gold); font-size:13px; letter-spacing:.3em;
    text-transform:uppercase; margin-bottom:12px; }
  .photo{
    width:224px; height:248px; object-fit:cover; object-position:center 22%;
    border:3px solid var(--paper); box-shadow:6px 6px 0 var(--gold);
    filter:saturate(1.05) contrast(1.03);
  }
  .name{ font-family:var(--f-display); color:var(--paper); font-size:44px;
    line-height:.9; text-align:center; margin-top:16px; }
  .name small{ display:block; color:var(--gold); font-family:var(--f-type);
    font-size:11px; letter-spacing:.18em; margin-top:8px; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="frame">
    <div class="tape"></div>
    <div class="left">
      <div class="presents">The City of Chicago (unofficially) presents</div>
      <div class="kicker">A Live Redemption Event</div>
      <div class="title">
        <span class="l1">One <em>Date</em></span>
        <span class="amp">·one·shot·</span>
      </div>
      <div class="script">the redemption tour</div>
      <div class="venue">Live in Chicago, Illinois</div>
      <div class="dates">JUN 3 <span class="dot">·</span> 4 <span class="dot">·</span> 5 <span class="dot">·</span> 6 <span class="yr">’26</span></div>
      <div class="stars">★★★★★</div>
      <div class="ctawrap"><span class="cta"><em>Josie!</em> Claim your ticket now →</span></div>
    </div>
    <div class="right">
      <div class="tab">Headlining</div>
      <img class="photo" src="assets/matt-star.jpg" alt="Matt Yee, live on stage" />
      <div class="name">Matt Yee<small>Now accepting second chances</small></div>
    </div>
  </div>
  <div class="vignette"></div>
</body>
</html>
